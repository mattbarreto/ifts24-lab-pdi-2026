[project]
name = "redes-neuronales-parte-1"
version = "0.1.0"
description = "Entorno de laboratorio para redes neuronales (parte 1): clasificacion, Teachable Machine y Gradio"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "seaborn",
    "scikit-learn",
    "tensorflow",
    "tensorflow-datasets",
    "pillow",
    "gradio",
    "opencv-python-headless",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
