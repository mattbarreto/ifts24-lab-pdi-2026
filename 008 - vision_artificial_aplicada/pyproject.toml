[project]
name = "vision-artificial-aplicada"
version = "0.1.0"
description = "Entorno de laboratorio para vision artificial aplicada: MediaPipe y Gradio"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python-headless>=4.8.0",
    "gradio>=4.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pycaw>=20181226; sys_platform == 'win32'",
    "comtypes>=1.2.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
