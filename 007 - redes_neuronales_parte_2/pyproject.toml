[project]
name = "redes-neuronales-parte-2"
version = "0.1.0"
description = "Entorno de laboratorio para redes neuronales (parte 2): CNNs, modelos preentrenados, Hugging Face y Gradio"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "pillow>=9.0.0",
    "tensorflow>=2.15.0",
    "tensorflow-datasets>=4.9.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "gradio>=4.0.0",
    "opencv-python-headless>=4.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
